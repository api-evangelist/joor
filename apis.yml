aid: joor
name: Joor
description: >-
  JOOR is a New York-based SaaS company (founded 2010) operating a leading
  B2B wholesale fashion commerce platform and digital marketplace that connects
  fashion brands with retailers to run their wholesale business end to end.
  The platform digitizes wholesale buying with online linesheets, lookbooks,
  virtual showrooms, order management, and the JOOR Marketplace, alongside
  products such as JOOR Pay (wholesale payments), JOOR Passport (virtual trade
  shows), and Retail data/analytics. JOOR connects thousands of brands with
  hundreds of thousands of retail doors globally. Its production platform is
  fronted by a Kong API gateway and secured with Keycloak-based OpenID Connect
  authentication; API access is partner/integration-oriented rather than a
  self-serve public developer program. This profile was enriched from JOOR's
  live public surface (OIDC discovery, GitHub organization, and status page).
